<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور | Z Horror</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'accent': '#F40009',
                        'accent-hover': '#d10007',
                        'dark': '#121212',
                        'darker': '#0a0a0a',
                        'card': 'rgba(30, 30, 30, 0.6)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'blood-drip': 'bloodDrip 3s ease-in-out infinite',
                        'slide-down': 'slideDown 0.3s ease-out forwards',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'shimmer': 'shimmer 2s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glow: {
                            '0%': { textShadow: '0 0 5px rgba(244, 0, 9, 0.5)' },
                            '100%': { textShadow: '0 0 15px rgba(244, 0, 9, 0.8), 0 0 20px rgba(244, 0, 9, 0.5)' },
                        },
                        bloodDrip: {
                            '0%': { height: '0', opacity: 0 },
                            '30%': { height: '30px', opacity: 1 },
                            '60%': { height: '10px', opacity: 0.7 },
                            '100%': { height: '0', opacity: 0 }
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-10px)', opacity: 0 },
                            '100%': { transform: 'translateY(0)', opacity: 1 },
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' }
                        }
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'noise-pattern': "url(\"data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E\")",
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }

        ::-webkit-scrollbar-thumb {
            background: #F40009;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff3333;
        }

        .blood-drip {
            position: absolute;
            top: 0;
            width: 2px;
            height: 0;
            background-color: #F40009;
            border-radius: 0 0 2px 2px;
            animation: bloodDrip 3s ease-in-out infinite;
            opacity: 0;
            z-index: 10;
        }

        .blood-drip-page {
            position: fixed;
            top: 0;
            width: 2px;
            height: 0;
            background-color: #F40009;
            border-radius: 0 0 2px 2px;
            animation: bloodDrip 3s ease-in-out infinite;
            opacity: 0;
            z-index: 1000;
        }

        .blood-drip-page:nth-child(1) {
            left: 10%;
            animation-delay: 0.7s;
        }

        .blood-drip-page:nth-child(2) {
            left: 25%;
            animation-delay: 1.9s;
        }

        .blood-drip-page:nth-child(3) {
            left: 45%;
            animation-delay: 0.3s;
        }

        .blood-drip-page:nth-child(4) {
            left: 65%;
            animation-delay: 1.2s;
        }

        .blood-drip-page:nth-child(5) {
            left: 85%;
            animation-delay: 2.1s;
        }

        .blood-drip:nth-child(1) {
            left: 30%;
            animation-delay: 0.5s;
        }

        .blood-drip:nth-child(2) {
            left: 70%;
            animation-delay: 1.5s;
        }

        .blood-drip:nth-child(3) {
            left: 50%;
            animation-delay: 2.5s;
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
            background: radial-gradient(circle at 50% 50%, rgba(244, 0, 9, 0.3) 0%, transparent 80%);
        }

        .noise-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.05;
            pointer-events: none;
        }
        .back-to-home {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 201;
            transition: all 0.3s ease;
            background: rgba(18, 18, 18, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            text-decoration: none;
        }

        .back-to-home:hover {
            transform: translateX(-50%) translateY(-3px);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(244, 0, 9, 0.3);
        }

        .form-container {
            width: 100%;
            max-width: 450px;
            margin: 2rem auto;
            position: relative;
            border-radius: 1rem;
            overflow: hidden;
            background-color: #0a0a0a;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(244, 0, 9, 0.2);
            min-height: 450px;
            display: flex;
            flex-direction: column;
        }

        .form-content {
            position: relative;
            width: 100%;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(5px);
            flex: 1;
            min-height: 450px;
        }

        @media (min-width: 1024px) {
            .form-container {
                min-height: 550px;
            }

            .form-content {
                min-height: 550px;
                padding: 4rem;
            }

            .success-message {
                min-height: 550px;
            }
        }

        @media (min-width: 1440px) {
            .form-container {
                min-height: 600px;
            }

            .form-content {
                min-height: 600px;
                padding: 4.5rem;
            }

            .success-message {
                min-height: 600px;
            }
        }

        .form-title {
            position: relative;
            display: inline-block;
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(244, 0, 9, 0.3);
        }

        .form-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: 0;
            width: 60px;
            height: 3px;
            background-color: #F40009;
        }

        .form-subtitle {
            font-size: 1rem;
            color: #ccc;
            text-align: center;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        .input-field {
            position: relative;
            width: 100%;
            margin-bottom: 2.5rem;
        }

        .input-field input {
            width: 100%;
            padding: 1.25rem 1.5rem;
            padding-right: 2.5rem;
            background-color: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-field input:focus {
            outline: none;
            border-color: rgba(244, 0, 9, 0.5);
            box-shadow: 0 0 0 2px rgba(244, 0, 9, 0.2);
        }

        .input-field i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: 1rem;
            color: #999;
            transition: all 0.3s ease;
        }

        .input-field input:focus+i {
            color: #F40009;
        }

        .submit-button {
            display: inline-block;
            padding: 1.25rem 3rem;
            background-color: #F40009;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 1rem;
        }

        .submit-button:hover {
            background-color: #d10007;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(244, 0, 9, 0.3);
        }

        .submit-button:active {
            transform: translateY(-1px);
        }

        .success-message {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 10, 10, 0.95);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            z-index: 10;
            animation: fadeIn 0.5s ease-out forwards;
            min-height: 450px;
        }

        .success-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #F40009;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            position: relative;
            overflow: hidden;
        }

        .success-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(244, 0, 9, 0.2) 0%, transparent 70%);
            animation: pulse-red 2s infinite;
        }

        .success-icon i {
            font-size: 45px;
            color: #F40009;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .success-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .success-text {
            font-size: 1rem;
            color: #ccc;
            text-align: center;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .success-subtext {
            font-size: 0.875rem;
            color: #999;
            text-align: center;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        @keyframes bloodDrip {
            0% {
                height: 0;
                opacity: 0;
            }

            30% {
                height: 30px;
                opacity: 1;
            }

            60% {
                height: 10px;
                opacity: 0.7;
            }

            100% {
                height: 0;
                opacity: 0;
            }
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 5px rgba(244, 0, 9, 0.5);
            }

            100% {
                text-shadow: 0 0 15px rgba(244, 0, 9, 0.8), 0 0 20px rgba(244, 0, 9, 0.5);
            }
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(244, 0, 9, 0.7);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(244, 0, 9, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(244, 0, 9, 0);
            }
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 0.6s linear;
            background-color: rgba(255, 255, 255, 0.3);
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        .footer {
            width: 100%;
            text-align: center;
            padding: 1rem 0;
            color: #777;
            font-size: 0.875rem;
            margin-top: auto;
        }

        @media (max-width: 640px) {
            .form-container {
                margin: 1rem;
                width: calc(100% - 2rem);
                min-height: 500px;
            }

            .form-content {
                padding: 2.5rem;
                min-height: 500px;
            }

            .form-title {
                font-size: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .form-subtitle {
                font-size: 0.875rem;
                margin-bottom: 2rem;
                line-height: 1.5;
            }

            .input-field {
                margin-bottom: 2rem;
            }

            .input-field input {
                padding: 1rem 1.25rem;
                padding-right: 2.5rem;
                font-size: 0.875rem;
            }

            .submit-button {
                padding: 1rem 2rem;
                font-size: 0.875rem;
                margin-top: 1rem;
            }

            .back-to-home {
                top: 10px;
                padding: 0.5rem 1rem;
                font-size: 0.875rem;
            }

            .success-message {
                min-height: 500px;
                padding: 2.5rem;
            }

            .success-icon {
                width: 80px;
                height: 80px;
                margin-bottom: 1.5rem;
            }

            .success-icon i {
                font-size: 40px;
            }

            .success-title {
                font-size: 1.5rem;
                margin-bottom: 1rem;
            }

            .success-text {
                font-size: 0.875rem;
                margin-bottom: 1rem;
                line-height: 1.5;
            }

            .success-subtext {
                font-size: 0.75rem;
                margin-bottom: 1.75rem;
                line-height: 1.5;
            }
        }

        @media (max-width: 380px) {
            .form-container {
                margin: 0.5rem;
                width: calc(100% - 1rem);
                min-height: 550px;
            }

            .form-content {
                padding: 2rem;
                min-height: 550px;
            }

            .form-title {
                font-size: 1.25rem;
                margin-bottom: 1.25rem;
            }

            .form-subtitle {
                font-size: 0.75rem;
                margin-bottom: 1.5rem;
                line-height: 1.5;
            }

            .input-field {
                margin-bottom: 1.5rem;
            }

            .input-field input {
                padding: 0.875rem 1.125rem;
                padding-right: 2.25rem;
                font-size: 0.75rem;
            }

            .submit-button {
                padding: 0.875rem 1.75rem;
                font-size: 0.75rem;
                margin-top: 1rem;
            }

            .back-to-home {
                padding: 0.375rem 0.75rem;
                font-size: 0.75rem;
            }

            .success-message {
                min-height: 550px;
                padding: 2rem;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .form-container {
                margin: 0.5rem auto;
                max-height: calc(100vh - 2rem);
                min-height: 350px;
            }

            .form-content {
                padding: 1.75rem;
                overflow-y: auto;
                min-height: 350px;
            }

            .success-message {
                min-height: 350px;
                padding: 1.75rem;
            }

            .form-title {
                font-size: 1.25rem;
                margin-bottom: 1rem;
            }

            .form-subtitle {
                font-size: 0.75rem;
                margin-bottom: 1rem;
                line-height: 1.4;
            }

            .input-field {
                margin-bottom: 1rem;
            }

            .input-field input {
                padding: 0.75rem 1rem;
                padding-right: 2rem;
            }

            .submit-button {
                padding: 0.75rem 1.5rem;
                margin-top: 0.75rem;
            }

            .back-to-home {
                top: 5px;
            }

            .footer {
                padding: 0.5rem 0;
            }
        }

        @media (min-width: 768px) and (max-width: 1023px) {
            .form-container {
                min-height: 520px;
                max-width: 500px;
            }

            .form-content {
                min-height: 520px;
                padding: 3.5rem;
            }

            .success-message {
                min-height: 520px;
            }

            .form-title {
                font-size: 2.25rem;
                margin-bottom: 2.5rem;
            }

            .form-subtitle {
                font-size: 1.1rem;
                margin-bottom: 3rem;
            }

            .input-field {
                margin-bottom: 2.5rem;
            }

            .submit-button {
                padding: 1.25rem 3.5rem;
                font-size: 1.1rem;
            }
        }

        @media (min-width: 800px) and (max-width: 1023px) and (orientation: landscape) {
            .form-container {
                min-height: 480px;
                max-width: 600px;
            }

            .form-content {
                min-height: 480px;
                padding: 2.5rem;
            }

            .success-message {
                min-height: 480px;
            }
        }
    </style>
</head>

<body>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>

    <div class="animated-bg"></div>

    <a href="#" class="back-to-home">
        <i class="fas fa-home ml-2"></i>
        <span>الرئيسية</span>
    </a>

    <main class="flex-grow flex items-center justify-center py-8 px-4">
        <div class="form-container">
            <div class="noise-bg"></div>

            <div class="blood-drip" style="left: 10%; animation-delay: 0.3s;"></div>
            <div class="blood-drip" style="left: 30%; animation-delay: 1.2s;"></div>
            <div class="blood-drip" style="left: 50%; animation-delay: 0.7s;"></div>
            <div class="blood-drip" style="left: 70%; animation-delay: 1.8s;"></div>
            <div class="blood-drip" style="left: 90%; animation-delay: 0.5s;"></div>

            <div class="form-content" id="resetForm">
                <h1 class="form-title">استعادة كلمة المرور</h1>
                <p class="form-subtitle">أدخل بريدك الإلكتروني وسنرسل لك رابطًا لإعادة تعيين كلمة المرور</p>

                <div class="input-field">
                    <input type="email" id="email" placeholder="البريد الإلكتروني" />
                    <i class="fas fa-envelope"></i>
                </div>

                <button id="submitButton" class="submit-button">
                    إرسال رابط الاستعادة
                </button>
            </div>

            <div id="successMessage" class="success-message">
                <div class="success-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <h2 class="success-title">تم إرسال الرابط!</h2>
                <p class="success-text">تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني</p>
                <p class="success-subtext">يرجى التحقق من بريدك الإلكتروني واتباع التعليمات لإعادة تعيين كلمة المرور</p>
                <button id="backToLoginBtn" class="submit-button">
                    العودة إلى تسجيل الدخول
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 Zoldyck studio. جميع الحقوق محفوظة</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const animatedBg = document.querySelector('.animated-bg');
            const resetForm = document.getElementById('resetForm');
            const successMessage = document.getElementById('successMessage');
            const submitButton = document.getElementById('submitButton');
            const backToLoginBtn = document.getElementById('backToLoginBtn');
            const emailInput = document.getElementById('email');
            const formContainer = document.querySelector('.form-container');

            // Create dynamic blood drips for the form
            function createBloodDrips() {
                const formContainer = document.querySelector('.form-container');

                const existingDrips = formContainer.querySelectorAll('.blood-drip');
                existingDrips.forEach(drip => drip.remove());

                const positions = [10, 30, 50, 70, 90];
                const delays = [0.3, 1.2, 0.7, 1.8, 0.5];

                positions.forEach((pos, index) => {
                    const bloodDrip = document.createElement('div');
                    bloodDrip.className = 'blood-drip';
                    bloodDrip.style.left = `${pos}%`;
                    bloodDrip.style.animationDelay = `${delays[index]}s`;
                    formContainer.appendChild(bloodDrip);
                });
            }
            createBloodDrips();

            window.addEventListener('resize', createBloodDrips);

            document.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                animatedBg.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(244, 0, 9, 0.3) 0%, transparent 80%)`;
            });

            // Form submission
            submitButton.addEventListener('click', function (e) {
                e.preventDefault();

                if (!emailInput.value || !emailInput.value.includes('@')) {
                    emailInput.style.borderColor = '#F40009';
                    emailInput.classList.add('pulse-animation');

                    setTimeout(() => {
                        emailInput.classList.remove('pulse-animation');
                    }, 1000);

                    return;
                }

                submitButton.disabled = true;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري الإرسال...';

                setTimeout(() => {
                    // Show success message
                    resetForm.style.display = 'none';
                    successMessage.style.display = 'flex';
                }, 1500);
            });

            // Back to login button
            backToLoginBtn.addEventListener('click', function (e) {
                e.preventDefault();
                window.location.href = '#';
            });

            // Input field focus effects
            emailInput.addEventListener('focus', function () {
                this.parentElement.querySelector('i').style.color = '#F40009';
            });

            emailInput.addEventListener('blur', function () {
                if (!this.value) {
                    this.parentElement.querySelector('i').style.color = '#999';
                }
            });

            // Button ripple effect
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('click', function (e) {
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';

                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    this.appendChild(ripple);

                    setTimeout(() => ripple.remove(), 600);
                });
            });

            // Add pulse animation class
            function addPulseAnimation(element) {
                element.style.animation = 'pulse-red 2s infinite';
            }
        });
    </script>
</body>
