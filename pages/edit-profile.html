<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الملف الشخصي | Z Horror</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'accent': '#F40009',
                        'accent-hover': '#d10007',
                        'dark': '#121212',
                        'darker': '#0a0a0a',
                        'card': 'rgba(30, 30, 30, 0.6)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'blood-drip': 'bloodDrip 3s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glow: {
                            '0%': { textShadow: '0 0 5px rgba(244, 0, 9, 0.5)' },
                            '100%': { textShadow: '0 0 15px rgba(244, 0, 9, 0.8), 0 0 20px rgba(244, 0, 9, 0.5)' },
                        },
                        bloodDrip: {
                            '0%': { height: '0', opacity: 0 },
                            '30%': { height: '30px', opacity: 1 },
                            '60%': { height: '10px', opacity: 0.7 },
                            '100%': { height: '0', opacity: 0 }
                        }
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'noise-pattern': "url(\"data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E\")",
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../assets/css/pages/edit-profile.css">
</head>

<body>
    <!-- Page Title -->
    <div class="page-title-container">
        <div class="blood-drip"></div>
        <div class="blood-drip"></div>
        <div class="blood-drip"></div>
        <div class="blood-drip"></div>
        <h1 class="page-title">تعديل الملف الشخصي</h1>
    </div>

    <!-- Main Content -->
    <div class="profile-container">
        <div class="noise-bg"></div>

        <button class="back-button">
            <i class="fas fa-arrow-right"></i>
        </button>

        <div class="banner-container">
            <img id="banner-img" src="https://i.pinimg.com/736x/73/56/47/735647015e3a1bdc9bf8877250e4e70d.jpg"
                alt="صورة الغلاف">
            <div class="banner-edit-icon" id="open-banner-modal">
                <i class="fas fa-pen"></i>
            </div>
        </div>

        <!-- Profile Picture -->
        <div class="profile-pic-container">
            <div class="profile-pic-inner">
                <img id="profile-pic" src="https://i.pinimg.com/736x/9d/e5/d2/9de5d2ab40011b354914c778341e3bff.jpg"
                    alt="الصورة الشخصية">
            </div>
            <div class="edit-icon" id="open-profile-modal">
                <i class="fas fa-pen"></i>
            </div>
        </div>

        <!-- Form -->
        <div class="form-container">
            <div class="input-container">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم">
                <div class="text-helper">أنشئ اسم مستخدم لمشاركته مع الآخرين. اختر اسمًا تحبه!</div>
            </div>

            <div class="red-line"></div>

            <div class="input-container">
                <label for="bio">السيرة الذاتية</label>
                <textarea id="bio" placeholder="أخبر الآخرين عن نفسك!"></textarea>
                <div class="text-helper">يمكنك كتابة نبذة عن نفسك، اهتماماتك، وأنواع القصص المفضلة لديك</div>
            </div>

            <!-- Buttons -->
            <div class="flex gap-4 mt-8">
                <button class="btn btn-primary">حفظ التغييرات</button>
                <button class="btn btn-outline">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Profile Picture Modal -->

            </div>

                        </div>
                        <div class="avatar-item"
                            data-src="https://i.pinimg.com/736x/e2/9f/d3/e29fd3eca3bdb9b1642811fa797851db.jpg">
                            <img src="https://i.pinimg.com/736x/e2/9f/d3/e29fd3eca3bdb9b1642811fa797851db.jpg"
                                alt="صورة شخصية">
                        </div>
                        <div class="avatar-item"
                            data-src="https://i.pinimg.com/736x/42/3e/53/423e53bf5b622e99e1e7969bcb2ca917.jpg">
                            <img src="https://i.pinimg.com/736x/42/3e/53/423e53bf5b622e99e1e7969bcb2ca917.jpg"
                                alt="صورة شخصية">
                        </div>
                        <div class="avatar-item"
                            data-src="https://i.pinimg.com/736x/4b/51/80/4b5180f5b481015c4212114ff75d7f6d.jpg">
                            <img src="https://i.pinimg.com/736x/4b/51/80/4b5180f5b481015c4212114ff75d7f6d.jpg"
                                alt="صورة شخصية">
                        </div>
                        <div class="avatar-item"
                            data-src="https://i.pinimg.com/736x/85/5a/35/855a35027722fd5f4ae97fe281d1a49b.jpg">
                            <img src="https://i.pinimg.com/736x/85/5a/35/855a35027722fd5f4ae97fe281d1a49b.jpg"
                                alt="صورة شخصية">
                        </div>
                    </div>
                </div>

                <div class="avatar-category">
                    <h4 class="avatar-category-title">الرعب الكلاسيكي</h4>
                    <div class="avatar-grid">
                        <div class="avatar-item"

                        </div>
                        <div class="avatar-item"

                            <img src="https://i.pinimg.com/736x/94/b2/1a/94b21aa2617c9bce57847aa6f89a0434.jpg"
                                alt="صورة شخصية">
                        </div>
                        <div class="avatar-item"
                            data-src="https://i.pinimg.com/736x/f2/13/d4/f213d4835a9addd802c39dac964db4eb.jpg">
                            <img src="https://i.pinimg.com/736x/f2/13/d4/f213d4835a9addd802c39dac964db4eb.jpg"
                                alt="صورة شخصية">
                        </div>
                        <div class="avatar-item"
                            data-src="https://i.pinimg.com/736x/84/71/23/847123ef7da3c74c510454ade301b08b.jpg">
                            <img src="https://i.pinimg.com/736x/84/71/23/847123ef7da3c74c510454ade301b08b.jpg"
                                alt="صورة شخصية">
                        </div>
                        <div class="avatar-item"
                            data-src="https://i.pinimg.com/736x/6d/41/7d/6d417d97f4edb4351b5a755ea2dc3f79.jpg">
                            <img src="https://i.pinimg.com/736x/6d/41/7d/6d417d97f4edb4351b5a755ea2dc3f79.jpg"
                                alt="صورة شخصية">
                        </div>
                        <div class="avatar-item"
                            data-src="https://i.pinimg.com/736x/4b/b6/ef/4bb6ef982ebb6f7ac2321eed722daeea.jpg">
                            <img src="https://i.pinimg.com/736x/4b/b6/ef/4bb6ef982ebb6f7ac2321eed722daeea.jpg"
                                alt="صورة شخصية">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-primary" id="save-profile-pic">حفظ</button>
                <button class="modal-btn modal-btn-secondary" id="cancel-profile-pic">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Banner Modal -->
    <div id="banner-modal" class="modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">اختيار صورة الغلاف</h3>
                <button class="modal-close" id="close-banner-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="banner-category">
                    <h4 class="banner-category-title">الدماء الحمراء</h4>
                    <div class="banner-grid">
                        <div class="banner-item"
                            data-src="https://i.pinimg.com/736x/53/d4/5c/53d45c4ae5e46760c208777e3645d3e7.jpg">
                            <img src="https://i.pinimg.com/736x/53/d4/5c/53d45c4ae5e46760c208777e3645d3e7.jpg"
                                alt="صورة غلاف">
                        </div>
                        <div class="banner-item"
                            data-src="https://i.pinimg.com/736x/9c/ee/dd/9ceedd54e62659883574d1b03de71618.jpg">
                            <img src="https://i.pinimg.com/736x/9c/ee/dd/9ceedd54e62659883574d1b03de71618.jpg"
                                alt="صورة غلاف">
                        </div>
                        <div class="banner-item"
                            data-src="https://i.pinimg.com/736x/08/0a/c8/080ac813337c642942832db5f539edd9.jpg">
                            <img src="https://i.pinimg.com/736x/08/0a/c8/080ac813337c642942832db5f539edd9.jpg"
                                alt="صورة غلاف">
                        </div>
                        <div class="banner-item"
                            data-src="https://i.pinimg.com/736x/df/8b/a4/df8ba4c50dfd21a4007b2e9c2cbce512.jpg">
                            <img src="https://i.pinimg.com/736x/df/8b/a4/df8ba4c50dfd21a4007b2e9c2cbce512.jpg"
                                alt="صورة غلاف">
                        </div>
                    </div>
                </div>

                <div class="banner-category">
                    <h4 class="banner-category-title">بانرات أخرى</h4>
                    <div class="banner-grid">
                        <div class="banner-item"
                            data-src="https://i.pinimg.com/736x/66/48/4b/66484ba3f67d1e587a3a341ce11bf38b.jpg">
                            <img src="https://i.pinimg.com/736x/66/48/4b/66484ba3f67d1e587a3a341ce11bf38b.jpg"
                                alt="صورة غلاف">
                        </div>
                        <div class="banner-item"
                            data-src="https://i.pinimg.com/736x/b6/d2/2f/b6d22f0b7d98c548f78b357e3bc2d077.jpg">
                            <img src="https://i.pinimg.com/736x/b6/d2/2f/b6d22f0b7d98c548f78b357e3bc2d077.jpg"
                                alt="صورة غلاف">
                        </div>
                        <div class="banner-item"
                            data-src="https://i.pinimg.com/736x/e8/ad/d3/e8add3f512728a34d4f260a09504cd7f.jpg">
                            <img src="https://i.pinimg.com/736x/e8/ad/d3/e8add3f512728a34d4f260a09504cd7f.jpg"
                                alt="صورة غلاف">
                        </div>
                        <div class="banner-item"
                            data-src="https://i.pinimg.com/736x/90/d8/e4/90d8e496e7c152201fdfbe6b8ba64882.jpg">
                            <img src="https://i.pinimg.com/736x/90/d8/e4/90d8e496e7c152201fdfbe6b8ba64882.jpg"
                                alt="صورة غلاف">
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-primary" id="save-banner">حفظ</button>
                <button class="modal-btn modal-btn-secondary" id="cancel-banner">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // Variables to store selected images
        let selectedProfilePic = document.getElementById('profile-pic').src;
        let selectedBanner = document.getElementById('banner-img').src;
        let tempSelectedProfilePic = null;
        let tempSelectedBanner = null;

        // Function to disable scrolling
        function disableScroll() {
            document.body.classList.add('modal-open');
        }

        // Function to enable scrolling
        function enableScroll() {
            document.body.classList.remove('modal-open');
        }

        // Profile Picture Modal Functions
        document.getElementById('open-profile-modal').addEventListener('click', function () {
            const modal = document.getElementById('profile-modal');
            modal.style.display = 'block';
            disableScroll();

            setTimeout(() => {
                modal.classList.add('active');
            }, 10);

            tempSelectedProfilePic = selectedProfilePic;

            document.querySelectorAll('.avatar-item').forEach(avatar => {
                if (avatar.getAttribute('data-src') === selectedProfilePic) {
                    avatar.classList.add('selected');
                } else {
                    avatar.classList.remove('selected');
                }
            });
        });

        document.getElementById('close-profile-modal').addEventListener('click', closeProfileModal);
        document.getElementById('cancel-profile-pic').addEventListener('click', closeProfileModal);

        function closeProfileModal() {
            const modal = document.getElementById('profile-modal');
            modal.classList.remove('active');
            enableScroll();

            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        document.getElementById('save-profile-pic').addEventListener('click', function () {
            selectedProfilePic = tempSelectedProfilePic;
            document.getElementById('profile-pic').src = selectedProfilePic;
            closeProfileModal();
        });

        // Banner Modal Functions
        document.getElementById('open-banner-modal').addEventListener('click', function () {
            const modal = document.getElementById('banner-modal');
            modal.style.display = 'block';
            disableScroll();

            setTimeout(() => {
                modal.classList.add('active');
            }, 10);

            tempSelectedBanner = selectedBanner;

            document.querySelectorAll('.banner-item').forEach(banner => {
                if (banner.getAttribute('data-src') === selectedBanner) {
                    banner.classList.add('selected');
                } else {
                    banner.classList.remove('selected');
                }
            });
        });

        document.getElementById('close-banner-modal').addEventListener('click', closeBannerModal);
        document.getElementById('cancel-banner').addEventListener('click', closeBannerModal);

        function closeBannerModal() {
            const modal = document.getElementById('banner-modal');
            modal.classList.remove('active');
            enableScroll();

            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
        }

        document.getElementById('save-banner').addEventListener('click', function () {
            selectedBanner = tempSelectedBanner;
            document.getElementById('banner-img').src = selectedBanner;
            closeBannerModal();
        });

        // Avatar Selection
        document.querySelectorAll('.avatar-item').forEach(avatar => {
            avatar.addEventListener('click', function () {
                document.querySelectorAll('.avatar-item').forEach(a => a.classList.remove('selected'));
                this.classList.add('selected');
                tempSelectedProfilePic = this.getAttribute('data-src');
            });
        });

        // Banner Selection
        document.querySelectorAll('.banner-item').forEach(banner => {
            banner.addEventListener('click', function () {
                document.querySelectorAll('.banner-item').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                tempSelectedBanner = this.getAttribute('data-src');
            });
        });

        // Form Functions
        document.querySelector('.btn-primary').addEventListener('click', function () {
            const username = document.getElementById('username').value;
            const bio = document.getElementById('bio').value;

            if (!username) {
                alert('الرجاء إدخال اسم المستخدم');
                return;
            }

            alert('تم حفظ الملف الشخصي بنجاح!');
        });

        document.querySelector('.btn-outline').addEventListener('click', function () {
            if (confirm('هل أنت متأكد أنك تريد الإلغاء؟ سيتم فقدان أي تغييرات غير محفوظة.')) {
                document.getElementById('username').value = '';
                document.getElementById('bio').value = '';
            }
        });

        // Back Button
        document.querySelector('.back-button').addEventListener('click', function () {
            window.history.back();
        });

        // Close modals when clicking outside
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function (e) {
                if (e.target === this) {
                    if (this.id === 'profile-modal') {
                        closeProfileModal();
                    } else if (this.id === 'banner-modal') {
                        closeBannerModal();
                    }
                }
            });
        });

        // Handle escape key to close modals
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') {
                const profileModal = document.getElementById('profile-modal');
                const bannerModal = document.getElementById('banner-modal');

                if (profileModal.classList.contains('active')) {
                    closeProfileModal();
                } else if (bannerModal.classList.contains('active')) {
                    closeBannerModal();
                }
            }
        });
    </script>
</body>

</html>
