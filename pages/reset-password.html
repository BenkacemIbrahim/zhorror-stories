<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعادة تعيين كلمة المرور | Z Horror</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'accent': '#F40009',
                        'accent-hover': '#d10007',
                        'dark': '#121212',
                        'darker': '#0a0a0a',
                        'card': 'rgba(30, 30, 30, 0.6)',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'blood-drip': 'bloodDrip 3s ease-in-out infinite',
                        'slide-down': 'slideDown 0.3s ease-out forwards',
                        'fade-in': 'fadeIn 0.3s ease-out forwards',
                        'shimmer': 'shimmer 2s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glow: {
                            '0%': { textShadow: '0 0 5px rgba(244, 0, 9, 0.5)' },
                            '100%': { textShadow: '0 0 15px rgba(244, 0, 9, 0.8), 0 0 20px rgba(244, 0, 9, 0.5)' },
                        },
                        bloodDrip: {
                            '0%': { height: '0', opacity: 0 },
                            '30%': { height: '30px', opacity: 1 },
                            '60%': { height: '10px', opacity: 0.7 },
                            '100%': { height: '0', opacity: 0 }
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-10px)', opacity: 0 },
                            '100%': { transform: 'translateY(0)', opacity: 1 },
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' }
                        }
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                        'noise-pattern': "url(\"data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E\")",
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../assets/css/pages/reset-password.css">
</head>

<body>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>

    <div class="animated-bg"></div>

    <a href="#" class="back-to-home">
        <i class="fas fa-home ml-2"></i>
        <span>الرئيسية</span>
    </a>

    <main class="flex-grow flex items-center justify-center py-8 px-4">
        <div class="form-container">
            <div class="noise-bg"></div>

            <div class="blood-drip" style="left: 10%; animation-delay: 0.3s;"></div>
            <div class="blood-drip" style="left: 30%; animation-delay: 1.2s;"></div>
            <div class="blood-drip" style="left: 50%; animation-delay: 0.7s;"></div>
            <div class="blood-drip" style="left: 70%; animation-delay: 1.8s;"></div>
            <div class="blood-drip" style="left: 90%; animation-delay: 0.5s;"></div>

            <div class="form-content" id="resetForm">
                <h1 class="form-title">إعادة تعيين كلمة المرور</h1>
                <p class="form-subtitle">أدخل كلمة المرور الجديدة الخاصة بك</p>

                <div class="input-field">
                    <div class="input-container">
                        <input type="password" id="password" placeholder="كلمة المرور الجديدة" />
                        <i class="fas fa-lock"></i>
                        <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
                    </div>
                    <div class="password-strength-wrapper">
                        <div class="password-strength">
                            <div class="password-strength-bar" id="passwordStrengthBar"></div>
                        </div>
                        <div class="password-strength-text" id="passwordStrengthText">قوة كلمة المرور</div>
                        <div class="error-message" id="passwordError">كلمة المرور يجب أن تحتوي على 8 أحرف على الأقل
                        </div>
                    </div>
                </div>

                <div class="input-field">
                    <div class="input-container">
                        <input type="password" id="confirmPassword" placeholder="تأكيد كلمة المرور" />
                        <i class="fas fa-lock"></i>
                        <i class="fas fa-eye password-toggle" id="confirmPasswordToggle"></i>
                    </div>
                    <div class="error-message" id="confirmPasswordError">كلمات المرور غير متطابقة</div>
                </div>

                <button id="submitButton" class="submit-button" disabled>
                    تغيير كلمة المرور
                </button>
            </div>

            <div id="successMessage" class="success-message">
                <div class="success-icon">
                    <i class="fas fa-check"></i>
                </div>
                <h2 class="success-title">تم تغيير كلمة المرور!</h2>
                <p class="success-text">تم تغيير كلمة المرور الخاصة بك بنجاح</p>
                <button id="backToLoginBtn" class="submit-button">
                    العودة إلى تسجيل الدخول
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 Zoldyck studio. جميع الحقوق محفوظة</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Elements
            const animatedBg = document.querySelector('.animated-bg');
            const resetForm = document.getElementById('resetForm');
            const successMessage = document.getElementById('successMessage');
            const submitButton = document.getElementById('submitButton');
            const backToLoginBtn = document.getElementById('backToLoginBtn');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const passwordToggle = document.getElementById('passwordToggle');
            const confirmPasswordToggle = document.getElementById('confirmPasswordToggle');
            const passwordStrengthBar = document.getElementById('passwordStrengthBar');
            const passwordStrengthText = document.getElementById('passwordStrengthText');
            const passwordError = document.getElementById('passwordError');
            const confirmPasswordError = document.getElementById('confirmPasswordError');
            const formContainer = document.querySelector('.form-container');

            // Create dynamic blood drips for the form
            function createBloodDrips() {
                const formContainer = document.querySelector('.form-container');
                const existingDrips = formContainer.querySelectorAll('.blood-drip');
                existingDrips.forEach(drip => drip.remove());

                const positions = [10, 30, 50, 70, 90]; 
                const delays = [0.3, 1.2, 0.7, 1.8, 0.5];

                positions.forEach((pos, index) => {
                    const bloodDrip = document.createElement('div');
                    bloodDrip.className = 'blood-drip';
                    bloodDrip.style.left = `${pos}%`;
                    bloodDrip.style.animationDelay = `${delays[index]}s`;
                    formContainer.appendChild(bloodDrip);
                });
            }

            createBloodDrips();

            window.addEventListener('resize', createBloodDrips);

            document.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                animatedBg.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(244, 0, 9, 0.3) 0%, transparent 80%)`;
            });

            function setupPasswordToggle(passwordInput, toggleIcon) {
                toggleIcon.addEventListener('click', function () {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            }

            setupPasswordToggle(passwordInput, passwordToggle);
            setupPasswordToggle(confirmPasswordInput, confirmPasswordToggle);

            passwordInput.addEventListener('input', function () {
                const password = this.value;

                if (password === '') {
                    passwordStrengthBar.style.width = '0%';
                    passwordStrengthText.textContent = 'قوة كلمة المرور';
                    passwordError.style.display = 'none';
                    submitButton.disabled = true;
                    return;
                }

                let strength = 0;
                let strengthText = 'ضعيفة';
                let color = '#F40009';

                if (password.length >= 8) {
                    strength += 25;
                } else {
                    passwordError.style.display = 'block';
                    submitButton.disabled = true;
                    passwordStrengthBar.style.width = `${strength}%`;
                    passwordStrengthBar.style.backgroundColor = color;
                    passwordStrengthText.textContent = `قوة كلمة المرور: ${strengthText}`;
                    return;
                }

                passwordError.style.display = 'none';

                if (password.match(/[a-z]/)) {
                    strength += 25;
                }

                if (password.match(/[A-Z]/)) {
                    strength += 25;
                }
                
                if (password.match(/[0-9]/) || password.match(/[^a-zA-Z0-9]/)) {
                    strength += 25;
                }

                // Update strength bar
                passwordStrengthBar.style.width = `${strength}%`;

                // Update strength text and color
                if (strength <= 25) {
                    strengthText = 'ضعيفة جداً';
                    color = '#F40009';
                } else if (strength <= 50) {
                    strengthText = 'ضعيفة';
                    color = '#ff6b00';
                } else if (strength <= 75) {
                    strengthText = 'متوسطة';
                    color = '#ffd600';
                } else {
                    strengthText = 'قوية';
                    color = '#00b300';
                }

                passwordStrengthBar.style.backgroundColor = color;
                passwordStrengthText.textContent = `قوة كلمة المرور: ${strengthText}`;

                // Check if passwords match
                validatePasswords();
            });

            // Confirm password validation
            confirmPasswordInput.addEventListener('input', validatePasswords);

            function validatePasswords() {
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;

                if (confirmPassword === '') {
                    confirmPasswordError.style.display = 'none';
                    submitButton.disabled = true;
                    return;
                }

                if (password !== confirmPassword) {
                    confirmPasswordError.style.display = 'block';
                    submitButton.disabled = true;
                } else {
                    confirmPasswordError.style.display = 'none';

                    // Only enable button if password is at least 8 characters
                    if (password.length >= 8) {
                        submitButton.disabled = false;
                    }
                }
            }

            // Form submission
            submitButton.addEventListener('click', function (e) {
                e.preventDefault();

                submitButton.disabled = true;
                submitButton.innerHTML = '<i class="fas fa-spinner fa-spin ml-2"></i> جاري التغيير...';

                setTimeout(() => {
                    // Show success message
                    resetForm.style.display = 'none';
                    successMessage.style.display = 'flex';
                }, 1500);
            });

            // Back to login button
            backToLoginBtn.addEventListener('click', function (e) {
                e.preventDefault();
                window.location.href = '#';
            });

            // Button ripple effect
            const buttons = document.querySelectorAll('button');
            buttons.forEach(button => {
                button.addEventListener('click', function (e) {
                    const ripple = document.createElement('span');
                    ripple.className = 'ripple';

                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    ripple.style.left = x + 'px';
                    ripple.style.top = y + 'px';
                    this.appendChild(ripple);

                    setTimeout(() => ripple.remove(), 600);
                });
            });
        });
    </script>
</body>

</html>
