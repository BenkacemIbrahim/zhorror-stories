<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور | Z Horror</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="../assets/js/config/auth.js"></script>
    <link rel="stylesheet" href="../assets/css/pages/forgot-password.css">
</head>

<body>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>
    <div class="blood-drip-page"></div>

    <div class="animated-bg"></div>

    <a href="#" class="back-to-home">
        <i class="fas fa-home ml-2"></i>
        <span>الرئيسية</span>
    </a>

    <main class="flex-grow flex items-center justify-center py-8 px-4">
        <div class="form-container">
            <div class="noise-bg"></div>

            <div class="blood-drip" style="left: 10%; animation-delay: 0.3s;"></div>
            <div class="blood-drip" style="left: 30%; animation-delay: 1.2s;"></div>
            <div class="blood-drip" style="left: 50%; animation-delay: 0.7s;"></div>
            <div class="blood-drip" style="left: 70%; animation-delay: 1.8s;"></div>
            <div class="blood-drip" style="left: 90%; animation-delay: 0.5s;"></div>

            <div class="form-content" id="resetForm">
                <h1 class="form-title">استعادة كلمة المرور</h1>
                <p class="form-subtitle">أدخل بريدك الإلكتروني وسنرسل لك رابطًا لإعادة تعيين كلمة المرور</p>

                <div class="input-field">
                    <input type="email" id="email" placeholder="البريد الإلكتروني" />
                    <i class="fas fa-envelope"></i>
                </div>

                <button id="submitButton" class="submit-button">
                    إرسال رابط الاستعادة
                </button>
            </div>

            <div id="successMessage" class="success-message">
                <div class="success-icon">
                    <i class="fas fa-envelope"></i>
                </div>
                <h2 class="success-title">تم إرسال الرابط!</h2>
                <p class="success-text">تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني</p>
                <p class="success-subtext">يرجى التحقق من بريدك الإلكتروني واتباع التعليمات لإعادة تعيين كلمة المرور</p>
                <button id="backToLoginBtn" class="submit-button">
                    العودة إلى تسجيل الدخول
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 Zoldyck studio. جميع الحقوق محفوظة</p>
    </footer>

    <script src="../assets/js/pages/forgot-password.js"></script>
</body>

</html>
