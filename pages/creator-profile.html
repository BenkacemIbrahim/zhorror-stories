<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بروفايل Toji Fushiguro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'accent': '#F40009',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../assets/css/pages/creator-profile.css">
</head>

<body>
    <!-- Title in the background -->
    <h1 class="page-title">بروفايل Toji Fushiguro</h1>

    <div class="profile-container">
        <!-- Back Button - Added from editprofile.html -->
        <button class="back-button" id="back-button">
            <i class="fas fa-arrow-right"></i>
        </button>

        <!-- Banner -->
        <div class="banner-container">
            <img src="https://i.pinimg.com/736x/73/56/47/735647015e3a1bdc9bf8877250e4e70d.jpg" alt="صورة الغلاف"
                class="w-full h-full object-cover">
        </div>

        <!-- Profile Picture with Verification Badge -->
        <div class="profile-pic-container">
            <img id="profile-pic" src="https://i.pinimg.com/736x/9d/e5/d2/9de5d2ab40011b354914c778341e3bff.jpg"
                alt="الصورة الشخصية" class="w-full h-full rounded-full object-cover">
            <div class="verification-badge">
                <i class="fas fa-check"></i>
            </div>
        </div>

        <!-- User Info -->
        <div class="pt-14 pb-2 text-center">
            <div class="text-xl font-bold mb-3">toji fushiguro</div>

            <!-- Enhanced Stats Section -->
            <div class="stats-container">
                <div class="stat-item empty-stat" id="followers-stat">
                    <i class="fas fa-users stat-icon"></i>
                    <div class="stat-value" id="followers-count">0</div>
                    <div class="stat-label">Followers</div>
                </div>

                <div class="stat-item empty-stat" id="following-stat">
                    <i class="fas fa-user-plus stat-icon"></i>
                    <div class="stat-value" id="following-count">0</div>
                    <div class="stat-label">Following</div>
                </div>

                <div class="stat-item empty-stat" id="posts-stat">
                    <i class="fas fa-images stat-icon"></i>
                    <div class="stat-value" id="posts-count">0</div>
                    <div class="stat-label">Posts</div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-4 px-5 py-2">
            <div
                class="w-11 h-11 bg-gray-700 rounded-full flex items-center justify-center cursor-pointer hover:bg-accent transition-colors duration-300">
                <i class="fas fa-cog text-white"></i>
            </div>
            <div
                class="w-11 h-11 bg-gray-700 rounded-full flex items-center justify-center cursor-pointer hover:bg-accent transition-colors duration-300">
                <i class="fas fa-store text-white"></i>
            </div>
        </div>

        <!-- Bio -->
        <div class="px-5 py-3">
            <h3 class="section-title">السيرة الداتية :</h3>
            <p id="bio-text" class="text-right font-bold">مرحبا انا توجي وهادا تعريف شخصي لي</p>
            <a href="#" id="show-more" class="text-right">أظهر المزيد</a>
        </div>

        <!-- Advertisement Box -->
        <div class="w-full h-32 bg-cover bg-center"
            style="background-image: url('https://i.pinimg.com/736x/14/15/9c/14159c496486a2d9e2b0d449418dff65.jpg')">
        </div>

        <!-- Gray Box -->
        <div class="w-full">
            <h3 class="section-title">شارك معنا :</h3>

            <!-- Input Field -->
            <div class="px-5">
                <input type="text" class="text-input w-full" placeholder="What's happening?">
            </div>

            <!-- Icons and Button -->
            <div class="flex justify-between items-center px-5 py-2">
                <button class="btn btn-primary flex items-center justify-center gap-2">
                    <span>Send</span>
                    <span>↪</span>
                </button>
                <div class="flex gap-4">
                    <i
                        class="fa-solid fa-image text-white text-xl cursor-pointer hover:text-accent transition-colors duration-300"></i>
                    <i
                        class="fa-solid fa-pen-fancy text-white text-xl cursor-pointer hover:text-accent transition-colors duration-300"></i>
                    <i
                        class="fa-brands fa-elementor text-white text-xl cursor-pointer hover:text-accent transition-colors duration-300"></i>
                </div>
            </div>

            <!-- Red Line -->
            <div class="red-line"></div>

            <!-- Posts Section -->
            <h3 class="section-title">منشورات :</h3>
            <div class="h-24 flex items-center justify-center text-white">
                <p>ميزة النشر سيتم اضافتها في التحديت القادم</p>
            </div>
        </div>
    </div>

    <script>
        // Bio show more/less functionality
        document.getElementById('show-more').addEventListener('click', function (e) {
            e.preventDefault();
            const bioText = document.getElementById('bio-text');
            if (bioText.style.webkitLineClamp === 'unset') {
                bioText.style.webkitLineClamp = '2';
                bioText.style.overflow = 'hidden';
                this.textContent = 'أظهر المزيد';
            } else {
                bioText.style.webkitLineClamp = 'unset';
                bioText.style.overflow = 'visible';
                this.textContent = 'إخفاء النص';
            }
        });

        // Stats counter animation
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start);
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Stats hover effects and interaction
        const statItems = document.querySelectorAll('.stat-item');

        statItems.forEach(item => {
            item.addEventListener('click', function () {
                // Demo functionality - increment the counter on click
                const countElement = this.querySelector('.stat-value');
                const currentValue = parseInt(countElement.textContent);

                // Animate the counter
                animateValue(countElement, currentValue, currentValue + 1, 500);

                // Remove empty-stat class if value becomes > 0
                if (currentValue + 1 > 0) {
                    this.classList.remove('empty-stat');
                }

                // Add a ripple effect
                const ripple = document.createElement('span');
                ripple.classList.add('absolute', 'inset-0', 'bg-white', 'opacity-20', 'rounded-lg', 'scale-0');
                ripple.style.transform = 'scale(0)';
                ripple.style.animation = 'ripple-stat 0.6s linear forwards';

                // Add keyframe animation for ripple effect
                if (!document.querySelector('#ripple-animation')) {
                    const style = document.createElement('style');
                    style.id = 'ripple-animation';
                    style.textContent = `
                        @keyframes ripple-stat {
                            to {
                                transform: scale(1.5);
                                opacity: 0;
                            }
                        }
                    `;
                    document.head.appendChild(style);
                }

                this.appendChild(ripple);

                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });

            // Add hover sound effect (subtle)
            item.addEventListener('mouseenter', function () {
                // Create a subtle hover sound
                const hoverSound = new Audio();
                hoverSound.volume = 0.1; // Very quiet
                hoverSound.src = 'data:audio/wav;base64,UklGRpYWAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YXIWAAAAAElJREQ='; // Empty sound
                hoverSound.play().catch(e => { }); // Catch errors if browser blocks autoplay
            });
        });

        // Add ripple effect to buttons (EXCEPT the back button)
        const buttons = document.querySelectorAll('button:not(#back-button)');
        buttons.forEach(button => {
            button.addEventListener('click', function (e) {
                const x = e.clientX - e.target.getBoundingClientRect().left;
                const y = e.clientY - e.target.getBoundingClientRect().top;

                const ripple = document.createElement('span');
                ripple.style.position = 'absolute';
                ripple.style.width = '1px';
                ripple.style.height = '1px';
                ripple.style.borderRadius = '50%';
                ripple.style.transform = 'scale(0)';
                ripple.style.backgroundColor = 'rgba(255, 255, 255, 0.3)';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.animation = 'ripple 0.6s linear';

                this.style.position = 'relative';
                this.style.overflow = 'hidden';
                this.appendChild(ripple);

                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });

        // Add keyframe animation for ripple effect
        if (!document.querySelector('#button-ripple-animation')) {
            const style = document.createElement('style');
            style.id = 'button-ripple-animation';
            style.textContent = `
                @keyframes ripple {
                    to {
                        transform: scale(100);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        }

        // Initialize with a subtle entrance animation for stats
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                statItems.forEach((item, index) => {
                    setTimeout(() => {
                        item.style.opacity = '0';
                        item.style.transform = 'translateY(20px)';
                        item.style.transition = 'all 0.5s ease';

                        setTimeout(() => {
                            item.style.opacity = '1';
                            item.style.transform = 'translateY(0)';
                        }, 50);
                    }, index * 150);
                });
            }, 500);
        });

        // Back button functionality - Fixed to prevent layout issues
        document.getElementById('back-button').addEventListener('click', function (e) {
            // Prevent default behavior
            e.preventDefault();
            e.stopPropagation();

            // Show alert without affecting layout
            setTimeout(function () {
                alert('العودة إلى الصفحة السابقة');
                // You can replace this with actual navigation code
                // window.location.href = 'previous-page.html';
            }, 10);

            // Prevent any ripple or layout changes
            return false;
        });
    </script>
</body>

</html>
